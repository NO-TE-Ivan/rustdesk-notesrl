# v3: retry download vcpkg/Cargo; stop immediately if compilation fails.
name: Compila RustDesk NO.TE - Client solo ingresso
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  MAC_RUST_VERSION: '1.81'
  CARGO_NDK_VERSION: 3.1.2
  SCITER_ARMV7_CMAKE_VERSION: 3.29.7
  SCITER_NASM_DEBVERSION: 2.15.05-1
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  FLUTTER_WINDOWS_ARM_VERSION: 3.44.9
  FLUTTER_ELINUX_VERSION: 3.16.9
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_CMAKE_VERSION: 4.3.0
  ARMV7_VCPKG_COMMIT_ID: 6f29f12e82a8293156836ad81cc9bf5af41fe836
  VERSION: 1.5.0
  NDK_VERSION: r28c
  CARGO_EXPAND_VERSION: 1.0.95
  FLUTTER_RUST_BRIDGE_VERSION: 1.80.1
  UPLOAD_ARTIFACT: 'true'
  RENDEZVOUS_SERVER: ${{ vars.RENDEZVOUS_SERVER }}
  RS_PUB_KEY: ${{ vars.RS_PUB_KEY }}
jobs:
  bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-22.04
          extra-build-args: ''
          flutter-version: 3.22.3
          artifact-name: bridge-artifact
    steps:
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        repository: rustdesk/rustdesk
        ref: fada664df7a294d1d1a9ca3e7cd3637069122f17
        persist-credentials: false
    - name: Install prerequisites
      run: |
        sudo apt-get install ca-certificates -y
        sudo apt-get update -y
        sudo apt-get install -y \
          clang \
          cmake \
          curl \
          gcc \
          git \
          g++ \
          libclang-dev \
          libgtk-3-dev \
          llvm-dev \
          nasm \
          ninja-build \
          pkg-config \
          wget
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: bridge-${{ matrix.job.os }}
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ matrix.job.flutter-version }}
        cache: true
    - name: Install flutter rust bridge deps
      shell: bash
      run: |
        cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
        cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
        if [[ "${{ matrix.job.flutter-version }}" == "3.22.3" ]]; then
          # Default Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
        else
          # Flutter 3.44 bridge for Windows arm64: match that build's source/pubspec state so the
          # generated *.freezed.dart compiles against the same Flutter/freezed it resolves.
          bash .github/patches/apply_flutter_3.44_source_patches.sh
        fi
        pushd flutter && flutter pub get && popd
    - name: Run flutter rust bridge
      run: |
        ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
        cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.job.artifact-name }}
        path: |
          ./src/bridge_generated.rs
          ./src/bridge_generated.io.rs
          ./flutter/lib/generated_bridge.dart
          ./flutter/lib/generated_bridge.freezed.dart
          ./flutter/macos/Runner/bridge_generated.h
          ./flutter/ios/Runner/bridge_generated.h
  topmost:
    runs-on: windows-2022
    strategy:
      fail-fast: false
    env:
      build_output_dir: RustDeskTempTopMostWindow/WindowInjection/x64/Release
      project_path: WindowInjection/WindowInjection.vcxproj
    steps:
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
    - name: Download the source code
      run: |
        git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
    - name: Build the project
      run: |
        cd RustDeskTempTopMostWindow && git checkout ecd8d6a139eee76845ea66423fb739af450fda90
        msbuild ${{ env.project_path }} -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: topmostwindow-artifacts-x64
        path: |
          ./${{ env.build_output_dir }}/WindowInjection.dll
  windows:
    name: ${{ matrix.job.target }}
    needs:
    - bridge
    - topmost
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-pc-windows-msvc
          os: windows-2022
          arch: x86_64
          flutter-arch: x64
          vcpkg-triplet: x64-windows-static
          build-args: --vram
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        repository: rustdesk/rustdesk
        ref: fada664df7a294d1d1a9ca3e7cd3637069122f17
        persist-credentials: false
    - name: Incorpora server, chiave e modalita solo ingresso
      shell: python
      run: |
        import os, re, json, base64
        from pathlib import Path
        host = os.environ['RENDEZVOUS_SERVER'].strip()
        key = os.environ['RS_PUB_KEY'].strip()
        assert re.fullmatch(r'[A-Za-z0-9.-]+', host), 'RENDEZVOUS_SERVER mancante o non valido'
        assert len(base64.b64decode(key, validate=True)) == 32, 'RS_PUB_KEY non valida'
        p = Path('libs/hbb_common/src/config.rs')
        s = p.read_text(encoding='utf-8')
        s, n = re.subn(r'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[[^;]+;', 'pub const RENDEZVOUS_SERVERS: &[&str] = &[' + json.dumps(host) + '];', s)
        assert n == 1, 'Costante server non trovata'
        s, n = re.subn(r'pub const RS_PUB_KEY: &str = "[^"]*";', 'pub const RS_PUB_KEY: &str = ' + json.dumps(key) + ';', s)
        assert n == 1, 'Costante chiave non trovata'
        old = 'pub static ref DEFAULT_SETTINGS: RwLock<HashMap<String, String>> = Default::default();'
        assert s.count(old) == 1, 'DEFAULT_SETTINGS non trovata'
        entries = {'custom-rendezvous-server': host, 'key': key}
        new = 'pub static ref DEFAULT_SETTINGS: RwLock<HashMap<String, String>> = RwLock::new({\n    let mut settings = HashMap::new();\n'
        for k, v in entries.items():
            new += '    settings.insert(' + json.dumps(k) + '.to_owned(), ' + json.dumps(v) + '.to_owned());\n'
        new += '    settings\n});'
        s = s.replace(old, new)

        old_hard = 'pub static ref HARD_SETTINGS: RwLock<HashMap<String, String>> = Default::default();'
        assert s.count(old_hard) == 1, 'HARD_SETTINGS non trovata'
        hard = {'conn-type': 'incoming', 'disable-settings': 'Y', 'disable-account': 'Y', 'disable-ab': 'Y'}
        new_hard = 'pub static ref HARD_SETTINGS: RwLock<HashMap<String, String>> = RwLock::new({\n    let mut settings = HashMap::new();\n'
        for k, v in hard.items():
            new_hard += '    settings.insert(' + json.dumps(k) + '.to_owned(), ' + json.dumps(v) + '.to_owned());\n'
        new_hard += '    settings\n});'
        s = s.replace(old_hard, new_hard)
        old_override = 'pub static ref OVERWRITE_SETTINGS: RwLock<HashMap<String, String>> = Default::default();'
        assert s.count(old_override) == 1, 'OVERWRITE_SETTINGS non trovata'
        s = s.replace(old_override, new.replace('DEFAULT_SETTINGS:', 'OVERWRITE_SETTINGS:'))

        p.write_text(s, encoding='utf-8')
        print('DNS e chiave incorporati nei sorgenti:', host)
    - name: Restore bridge files
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
        path: ./
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        channel: stable
        flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
        architecture: x64
    - name: Replace engine with rustdesk custom flutter engine
      if: ${{ matrix.job.arch == 'x86_64' }}
      run: |
        flutter doctor -v
        flutter precache --windows
        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/
    - name: Patch flutter
      if: ${{ matrix.job.arch == 'x86_64' }}
      shell: bash
      run: |
        cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.SCITER_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: ${{ matrix.job.os }}
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: |
        for attempt in 1 2 3 4; do
          echo "Download e installazione dipendenze vcpkg: tentativo $attempt/4"
          if "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            exit 0
          fi
          if [ "$attempt" -lt 4 ]; then
            sleep 15
          fi
        done
        find "$VCPKG_ROOT/buildtrees/aom" -name '*err.log' -exec tail -n 60 {} \; || true
        exit 1
      shell: bash
    - name: Scarica dipendenze Rust con tentativi automatici
      shell: bash
      run: |
        for attempt in 1 2 3 4; do
          echo "Download dipendenze Rust: tentativo $attempt/4"
          if cargo fetch --locked --target x86_64-pc-windows-msvc; then
            exit 0
          fi
          if [ "$attempt" -lt 4 ]; then
            sleep 15
          fi
        done
        exit 1
    - name: Build rustdesk
      run: |
        # Windows: build RustDesk
        # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
        python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk

        # Download usbmmidd_v2.zip and extract it to ./rustdesk
        Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
        Expand-Archive usbmmidd_v2.zip -DestinationPath .
        Remove-Item -Path usbmmidd_v2\Win32 -Recurse
        Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
        mv -Force .\usbmmidd_v2 ./rustdesk

        # Download printer driver files and extract them to ./rustdesk
        try {
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

          # Check and move the files
          $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
          $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
          $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
          $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
          if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
              Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
              mkdir ./rustdesk/drivers
              mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath .
              mv -Force .\printer_driver_adapter.dll ./rustdesk
          } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
              Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
          } else {
              Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
          }
        } catch {
            Write-Host "Ingore the printer driver error."
        }
    - name: find Runner.res
      continue-on-error: true
      shell: bash
      run: |
        runner_res=$(find . -name "Runner.res");
        if [ "$runner_res" == "" ]; then
          echo "Runner.res: not found";
        else
          echo "Runner.res: $runner_res";
          cp $runner_res ./libs/portable/Runner.res;
          echo "list ./libs/portable/Runner.res";
          ls -l ./libs/portable/Runner.res;
        fi
    - name: Download RustDeskTempTopMostWindow artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
        path: ./rustdesk
    - name: Build self-extracted executable
      shell: bash
      if: env.UPLOAD_ARTIFACT == 'true'
      run: |
        sed -i '/dpiAware/d' res/manifest.xml
        pushd ./libs/portable
        pip3 install -r requirements.txt
        python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
        popd
        mkdir -p ./SignOutput
        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
    - name: Carica EXE personalizzato
      uses: actions/upload-artifact@v4
      with:
        name: RustDesk-NOTE-1.5.0-Client-solo-ingresso-x64
        path: SignOutput/*.exe
        if-no-files-found: error
        retention-days: 30
    timeout-minutes: 180
